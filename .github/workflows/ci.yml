name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test without PyYAML
        run: python -m pytest -q
      - name: Test with PyYAML
        run: |
          python -m pip install PyYAML
          python -m pytest -q
      - name: Lint the bundled examples
        shell: bash
        run: |
          skillvet examples/good --strict
          if skillvet examples/bad; then echo "bad examples should fail"; exit 1; fi
